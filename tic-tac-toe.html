<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
:root{
--bg:#fafafa;--fg:#111;--muted:#666;--strong:#111;
--cell-bg:#fff;--cell-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px #eee;--cell-hover:#f3f4f6;
--x:#2563eb;--o:#dc2626;--win-bg:#111;--win-fg:#fff;
--color-scheme:light;
}
[data-theme="dark"]{
--bg:#0f1115;--fg:#e8eaf0;--muted:#9aa1b2;--strong:#fff;
--cell-bg:#1a1e27;--cell-shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px #2a3040;--cell-hover:#242a3a;
--x:#60a5fa;--o:#f87171;--win-bg:#e8eaf0;--win-fg:#0f1115;
--color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);transition:background .2s,color .2s;color-scheme:var(--color-scheme)}
.card{text-align:center;position:relative}
.theme-toggle{position:absolute;top:-56px;right:0;border:1px solid transparent;border-radius:999px;padding:7px 14px;font-size:.85rem;cursor:pointer;background:var(--cell-bg);color:var(--fg);box-shadow:var(--cell-shadow);transition:transform .08s,background .15s}
.theme-toggle:hover{transform:translateY(-1px)}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
.status{color:var(--muted);font-size:.95rem;height:1.5em;margin-bottom:20px}
.status strong{color:var(--strong)}
.board{display:grid;grid-template-columns:repeat(3,96px);grid-template-rows:repeat(3,96px);gap:8px;justify-content:center}
.cell{border:0;border-radius:14px;background:var(--cell-bg);box-shadow:var(--cell-shadow);font-size:2.2rem;font-weight:600;cursor:pointer;transition:transform .08s,box-shadow .15s,background .15s;color:var(--fg);display:flex;align-items:center;justify-content:center}
.cell:hover:not(:disabled){background:var(--cell-hover);transform:translateY(-1px)}
.cell:disabled{cursor:default}
.cell.x{color:var(--x)}
.cell.o{color:var(--o)}
.cell.win{background:var(--win-bg);color:var(--win-fg)}
button.reset{margin-top:22px;padding:10px 22px;border-radius:999px;border:1px solid #dc2626;background:#dc2626;color:#fff;font-size:.9rem;cursor:pointer;transition:background .15s}
button.reset:hover{background:#b91c1c;border-color:#b91c1c;color:#fff}
.scores{display:flex;gap:24px;justify-content:center;margin-top:16px;font-size:.85rem;color:var(--muted)}
.scores b{color:var(--strong);font-size:1rem;display:block}
</style>
</head>
<body>
<div class="card">
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙 Dark</button>
<h1>Tic Tac Toe</h1>
<div class="status" id="status">X's turn</div>
<div class="board" id="board"></div>
<div class="scores">
<div><b id="sx">0</b>X wins</div>
<div><b id="sd">0</b>Draws</div>
<div><b id="so">0</b>O wins</div>
</div>
<button class="reset" onclick="reset(true)">Reset game</button>
</div>
<script>
const board=document.getElementById('board');
const status=document.getElementById('status');
const themeToggle=document.getElementById('themeToggle');
function applyTheme(t){
document.documentElement.dataset.theme=t;
themeToggle.textContent=t==='dark'?'☀️ Light':'🌙 Dark';
try{localStorage.setItem('ttt-theme',t);}catch(e){}
}
(function initTheme(){
let saved=null;
try{saved=localStorage.getItem('ttt-theme');}catch(e){}
if(saved==='light'||saved==='dark'){applyTheme(saved);}
else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){applyTheme('dark');}
else{applyTheme('light');}
})();
themeToggle.onclick=()=>{applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');};
if(window.matchMedia){
try{
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{
let saved=null;
try{saved=localStorage.getItem('ttt-theme');}catch(err){}
if(!saved){applyTheme(e.matches?'dark':'light');}
});
}catch(e){}
}
let cells,turn,over;
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const score={X:0,O:0,D:0};
function reset(full){
cells=Array(9).fill('');turn='X';over=false;
board.innerHTML='';
cells.forEach((_,i)=>{
const b=document.createElement('button');
b.className='cell';b.onclick=()=>move(i,b);
board.appendChild(b);
});
setStatus(`${turn}'s turn`);
}
function setStatus(t){status.innerHTML=t;}
function move(i,btn){
if(over||cells[i])return;
cells[i]=turn;
btn.textContent=turn;
btn.classList.add(turn.toLowerCase());
btn.disabled=true;
const w=checkWin();
if(w){
over=true;
w.forEach(i=>board.children[i].classList.add('win'));
score[turn]++;
setStatus(`<strong>${turn} wins!</strong>`);
update();
return;
}
if(cells.every(c=>c)){
over=true;score.D++;
setStatus(`<strong>Draw!</strong>`);
update();return;
}
turn=turn==='X'?'O':'X';
setStatus(`${turn}'s turn`);
}
function checkWin(){
for(const c of wins){
const[a,b,d]=c;
if(cells[a]&&cells[a]===cells[b]&&cells[a]===cells[d])return c;
}
return null;
}
function update(){
document.getElementById('sx').textContent=score.X;
document.getElementById('so').textContent=score.O;
document.getElementById('sd').textContent=score.D;
}
reset();
</script>
</body>
</html>
